<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sub-mission / 3D</title>
<style>
 body{background:#0b0f14;color:#e6edf3;font-family:ui-monospace,Menlo,monospace;
      margin:0;min-height:100vh;display:grid;place-items:center}
 .card{border:1px solid #2d333b;border-radius:8px;padding:26px 32px;max-width:560px}
 h1{font-size:14px;letter-spacing:.09em;text-transform:uppercase;margin:0 0 16px;color:#e6edf3}
 a{display:block;color:#7ee787;text-decoration:none;padding:8px 0;font-size:13px}
 a:hover{text-decoration:underline}
 .m{color:#8b949e;font-size:11px;margin-top:18px;line-height:1.8;border-top:1px solid #21262d;padding-top:14px}
 kbd{background:#161b22;border:1px solid #30363d;border-radius:3px;padding:0 4px;color:#e6edf3}
</style>
</head>
<body>
<div class="card">
  <h1>sub-mission / 3D viewer</h1>
  <a href="scene.html">1 &middot; exploded drivetrain (default)</a>
  <a href="scene.html?view=site&amp;explode=0">2 &middot; bank structure, assembled</a>
  <a href="scene.html?view=site">3 &middot; bank structure, exploded</a>
  <div class="m">
    <kbd>1</kbd> assembled &nbsp; <kbd>2</kbd> explode &nbsp; <kbd>3</kbd> wide explode<br>
    <kbd>d</kbd> drivetrain &nbsp; <kbd>s</kbd> bank structure<br>
    drag to orbit &middot; scroll to zoom
  </div>
</div>
</body>
</html>
